<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>团体标准业务运营工作台 V4</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--brand:#1f4e78;--brand2:#2f75b5;--danger:#b42318;--ok:#2e7d32}
*{box-sizing:border-box} body{margin:0;font-family:"Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text)}
.hidden{display:none!important}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#eef4f9,#f9fbfd)}
.login-card{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 14px 40px rgba(31,78,121,.10)}
.login-card h1{font-size:24px;margin:0 0 8px} .muted{color:var(--muted);font-size:13px}
.login-card input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;margin-top:10px;font:inherit}
.login-card button{width:100%;margin-top:14px}
.layout{display:grid;grid-template-columns:245px 1fr;min-height:100vh}
aside{background:#102a43;color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh}
.logo{font-size:20px;font-weight:800;margin:0 8px 24px} .logo small{display:block;color:#b9c8d5;font-size:11px;font-weight:400;margin-top:6px}
.nav button{width:100%;border:0;background:transparent;color:#dce6ef;text-align:left;padding:12px 14px;border-radius:8px;margin:3px 0;cursor:pointer}
.nav button.active,.nav button:hover{background:#1c4569;color:#fff}
main{padding:24px 28px 60px;overflow:auto}
.topbar{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}
h1{margin:0;font-size:25px} h2{font-size:18px;margin:0 0 12px}
.status{font-size:12px;padding:5px 9px;border-radius:999px;background:#eaf3fb;color:#1f4e78}
.status.ok{background:#e9f7ec;color:#2e7d32} .status.bad{background:#fdecec;color:#b42318}
.actions{display:flex;gap:8px;flex-wrap:wrap} button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px;cursor:pointer}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff} button.danger{color:var(--danger)}
.section{display:none} .section.active{display:block}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px} .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px}
.metric{font-size:26px;font-weight:800;margin-top:5px}
.callout{background:#eef6fc;border-left:4px solid var(--brand2);border-radius:8px;padding:12px 14px;margin:14px 0}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:70vh;background:#fff}
table{width:100%;border-collapse:collapse;font-size:13px} th,td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left;white-space:nowrap}
th{background:#edf3f7;position:sticky;top:0;z-index:1} td[contenteditable="true"]{background:#fffdf2;outline:none}
td[contenteditable="true"]:focus{box-shadow:inset 0 0 0 2px #efc76a}
.formrow{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:10px;margin:10px 0}
input,select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;background:#fff}
@media(max-width:900px){.layout{grid-template-columns:1fr}aside{position:relative;height:auto}.grid{grid-template-columns:1fr 1fr}.formrow{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<div id="loginPage" class="login-wrap">
  <div class="login-card">
    <h1>团体标准业务运营工作台</h1>
    <div class="muted">V3 · 登录后访问云端数据</div>
    <input id="emailInput" type="email" placeholder="邮箱">
    <input id="passwordInput" type="password" placeholder="密码">
    <button class="primary" onclick="login()">登录</button>
    <div id="loginMsg" class="muted" style="margin-top:12px"></div>
  </div>
</div>

<div id="appPage" class="layout hidden">
<aside>
  <div class="logo">团标业务工作台<small>V4 · 登录保护 + 云同步 + 智能排版</small></div>
  <div class="nav">
    <button class="active" data-sec="dashboard">首页总览</button>
    <button data-sec="topics">C端内容选题</button>
    <button data-sec="leads">客户线索</button>
    <button data-sec="projects">团标项目池</button>
    <button data-sec="channels">B端渠道库</button>
    <button data-sec="policies">职称政策库</button>
    <button data-sec="formattool">标准智能排版</button>
    <button data-sec="decisions">决策日志</button>
  </div>
</aside>

<main>
  <div class="topbar">
    <div>
      <h1 id="pageTitle">首页总览</h1>
      <div class="muted"><span id="userEmail"></span> · <span id="syncTime">尚未同步</span></div>
    </div>
    <div class="actions">
      <span id="cloudStatus" class="status">连接中</span>
      <button onclick="loadAll()">刷新云端数据</button>
      <button class="danger" onclick="logout()">退出登录</button>
    </div>
  </div>

  <section id="dashboard" class="section active">
    <div class="grid">
      <div class="card"><div class="muted">内容选题</div><div class="metric" id="kTopics">0</div></div>
      <div class="card"><div class="muted">客户线索</div><div class="metric" id="kLeads">0</div></div>
      <div class="card"><div class="muted">团标项目</div><div class="metric" id="kProjects">0</div></div>
      <div class="card"><div class="muted">B端渠道</div><div class="metric" id="kChannels">0</div></div>
    </div>
    <div class="callout"><b>当前执行方案：</b>1个“工程职称成果”主账号，先测试建筑工程、机电/电气、水利工程三个栏目；核心指标是有效咨询、加微信、报价和成交。</div>
    <div class="card">
      <h2>当前经营原则</h2>
      <ul>
        <li>先查政策，再推荐项目。</li>
        <li>按省份 × 专业 × 层级 × 年度核验。</li>
        <li>不承诺“团标必然加分”或“包过职称”。</li>
        <li>真实参与编制，并保留过程材料。</li>
      </ul>
    </div>
  </section>

  <section id="topics" class="section">
    <div class="actions" style="margin-bottom:12px"><button class="primary" onclick="addTopic()">+ 新增选题</button></div>
    <div class="tablewrap"><table id="topicTable"></table></div>
  </section>

  <section id="leads" class="section">
    <h2>新增客户线索</h2>
    <div class="formrow">
      <input id="leadName" placeholder="姓名/昵称">
      <input id="leadSource" placeholder="来源平台/渠道">
      <input id="leadProvince" placeholder="省份">
      <input id="leadMajor" placeholder="专业/职称系列">
    </div>
    <div class="formrow">
      <select id="leadLevel"><option>中级</option><option>副高</option><option>正高</option><option>其他</option></select>
      <input id="leadYear" placeholder="申报年份，如2027">
      <select id="leadFit"><option>待核</option><option>S-明确匹配</option><option>A-需二级核验</option><option>B-历史/弱依据</option><option>C-暂不建议</option></select>
      <select id="leadStage"><option>新线索</option><option>政策诊断</option><option>项目匹配</option><option>已报价</option><option>跟进中</option><option>已成交</option><option>已流失</option></select>
    </div>
    <button class="primary" onclick="addLead()">保存线索</button>
    <div class="tablewrap" style="margin-top:14px"><table id="leadTable"></table></div>
  </section>

  <section id="projects" class="section">
    <div class="actions" style="margin-bottom:12px"><button class="primary" onclick="addProject()">+ 新增项目</button></div>
    <div class="tablewrap"><table id="projectTable"></table></div>
  </section>

  <section id="channels" class="section">
    <div class="actions" style="margin-bottom:12px"><button class="primary" onclick="addChannel()">+ 新增渠道</button></div>
    <div class="tablewrap"><table id="channelTable"></table></div>
  </section>

  <section id="policies" class="section">
    <div class="actions" style="margin-bottom:12px"><button class="primary" onclick="addPolicy()">+ 新增政策记录</button></div>
    <div class="tablewrap"><table id="policyTable"></table></div>
  </section>


  <section id="formattool" class="section">
    <div class="card" style="padding:0;overflow:hidden">
      <iframe src="tools/format.html" title="标定｜团体标准智能排版工具" style="width:100%;height:calc(100vh - 120px);min-height:760px;border:0;background:#fff"></iframe>
    </div>
  </section>

  <section id="decisions" class="section">
    <div class="actions" style="margin-bottom:12px"><button class="primary" onclick="addDecision()">+ 新增决策</button></div>
    <div class="tablewrap"><table id="decisionTable"></table></div>
  </section>
</main>
</div>

<script>
const SUPABASE_URL = "https://rirxbhjcaqkuwkkriozm.supabase.co";
const SUPABASE_KEY = "sb_publishable_wfX3AFQv5wcQl-B6sFbljA_C-UF-S_J";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let data={topics:[],leads:[],projects:[],channels:[],policies:[],decisions:[]};

const secTitles={dashboard:"首页总览",topics:"C端内容选题",leads:"客户线索",projects:"团标项目池",channels:"B端渠道库",policies:"职称政策库",formattool:"标准智能排版",decisions:"决策日志"};
document.querySelectorAll(".nav button").forEach(btn=>btn.onclick=()=>{
  document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active"); document.getElementById(btn.dataset.sec).classList.add("active");
  document.getElementById("pageTitle").textContent=secTitles[btn.dataset.sec];
});

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function setStatus(ok,msg){const e=document.getElementById("cloudStatus");e.textContent=msg;e.className="status "+(ok?"ok":"bad");}

async function login(){
  loginMsg.textContent="正在登录…";
  const email=emailInput.value.trim(), password=passwordInput.value;
  const {data,error} = await sb.auth.signInWithPassword({email,password});
  if(error){ loginMsg.textContent="登录失败："+error.message; return; }
  loginMsg.textContent="";
  showApp(data.user);
}

async function logout(){
  await sb.auth.signOut();
  document.getElementById("appPage").classList.add("hidden");
  document.getElementById("loginPage").classList.remove("hidden");
  passwordInput.value="";
  loginMsg.textContent="已退出登录";
}

async function showApp(user){
  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("appPage").classList.remove("hidden");
  document.getElementById("userEmail").textContent=user?.email || "已登录";
  await loadAll();
}

async function checkSession(){
  const {data:{session}} = await sb.auth.getSession();
  if(session?.user) showApp(session.user);
  else {
    document.getElementById("loginPage").classList.remove("hidden");
    document.getElementById("appPage").classList.add("hidden");
  }
}

async function loadAll(){
  setStatus(true,"同步中");
  try {
    const [t,l,p,c,po,d]=await Promise.all([
      sb.from("content_topics").select("*").order("id"),
      sb.from("customer_leads").select("*").order("id",{ascending:false}),
      sb.from("projects").select("*").order("id"),
      sb.from("channels").select("*").order("id"),
      sb.from("policy_rules").select("*").order("id"),
      sb.from("decision_logs").select("*").order("id",{ascending:false})
    ]);
    for(const x of [t,l,p,c,po,d]) if(x.error) throw x.error;
    data.topics=t.data||[];data.leads=l.data||[];data.projects=p.data||[];data.channels=c.data||[];data.policies=po.data||[];data.decisions=d.data||[];
    renderAll();syncTime.textContent="最后同步："+new Date().toLocaleString();setStatus(true,"云端已连接");
  } catch(e){setStatus(false,"同步失败");alert("云端同步失败："+e.message);}
}

function editableTable(el,headers,rows,fields,table){
  el.innerHTML=`<thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}<th>操作</th></tr></thead><tbody>`+
  rows.map(r=>`<tr>${fields.map(f=>`<td contenteditable="true" data-id="${r.id}" data-f="${f}">${esc(r[f])}</td>`).join("")}<td><button class="danger" data-del="${r.id}">删除</button></td></tr>`).join("")+"</tbody>";
  el.querySelectorAll('td[contenteditable]').forEach(td=>td.onblur=async()=>{
    let val=td.innerText.trim();const field=td.dataset.f;
    if(["views","dm_count","lead_count","wechat_count","quote_count","deal_count","current_people","target_people","total_leads","total_deals"].includes(field)) val=Number(val||0);
    const res=await sb.from(table).update({[field]:val}).eq("id",Number(td.dataset.id));
    if(res.error){alert("保存失败："+res.error.message);loadAll();}else setStatus(true,"已自动保存");
  });
  el.querySelectorAll("[data-del]").forEach(btn=>btn.onclick=async()=>{
    if(!confirm("确认删除这条记录？"))return;
    const res=await sb.from(table).delete().eq("id",Number(btn.dataset.del));
    if(res.error)alert("删除失败："+res.error.message);else loadAll();
  });
}

function renderAll(){
  kTopics.textContent=data.topics.length;kLeads.textContent=data.leads.length;kProjects.textContent=data.projects.length;kChannels.textContent=data.channels.length;
  editableTable(topicTable,["编号","垂类","类型","标题","状态","播放","私信","有效线索","加微信","报价","成交"],data.topics,["code","vertical","content_type","title","status","views","dm_count","lead_count","wechat_count","quote_count","deal_count"],"content_topics");
  editableTable(leadTable,["日期","姓名","来源","省份","专业","等级","年份","政策匹配","阶段"],data.leads,["lead_date","name","source","province","major","level","apply_year","policy_fit","sales_stage"],"customer_leads");
  editableTable(projectTable,["项目编号","标准名称","专业","细分方向","协会","阶段","预计发布","角色/位置","状态"],data.projects,["project_code","standard_name","major","sub_major","association_name","stage","expected_publish_date","roles","status"],"projects");
  editableTable(channelTable,["渠道编号","名称","类型","地区","联系人","联系方式","客户群体","合作状态","累计成交"],data.channels,["channel_code","name","channel_type","area","contact_name","contact_info","audience","status","total_deals"],"channels");
  editableTable(policyTable,["省份","专业","层级","政策状态","政策名称","年份","风险","官方链接","销售建议"],data.policies,["province","profession","level","status","policy_name","policy_year","risk_level","official_url","sales_note"],"policy_rules");
  editableTable(decisionTable,["日期","模块","原方案","新决策","原因","状态","验证指标"],data.decisions,["decision_date","module","old_plan","decision","reason","status","metric"],"decision_logs");
}

async function addTopic(){let r=await sb.from("content_topics").insert({code:"C"+String(data.topics.length+1).padStart(3,"0"),vertical:"建筑工程",content_type:"政策搜索型",title:"新选题",status:"待发布"});if(r.error)alert(r.error.message);else loadAll();}
async function addLead(){let r=await sb.from("customer_leads").insert({name:leadName.value,source:leadSource.value,province:leadProvince.value,major:leadMajor.value,level:leadLevel.value,apply_year:leadYear.value,policy_fit:leadFit.value,sales_stage:leadStage.value});if(r.error)alert(r.error.message);else loadAll();}
async function addProject(){let r=await sb.from("projects").insert({project_code:"P"+String(data.projects.length+1).padStart(3,"0"),standard_name:"新团体标准项目",major:"建筑工程",stage:"选题筹备",status:"可匹配"});if(r.error)alert(r.error.message);else loadAll();}
async function addChannel(){let r=await sb.from("channels").insert({channel_code:"B"+String(data.channels.length+1).padStart(3,"0"),name:"新渠道",channel_type:"职称咨询",status:"未联系"});if(r.error)alert(r.error.message);else loadAll();}
async function addPolicy(){let r=await sb.from("policy_rules").insert({province:"待填写",profession:"建筑工程",level:"副高",status:"待核",risk_level:"中"});if(r.error)alert(r.error.message);else loadAll();}
async function addDecision(){let r=await sb.from("decision_logs").insert({module:"待分类",decision:"新决策",status:"待讨论"});if(r.error)alert(r.error.message);else loadAll();}

passwordInput.addEventListener("keydown",e=>{if(e.key==="Enter")login();});
checkSession();
</script>
</body>
</html>
